<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        <option value="en">English</option>
        <option value="pt">Português</option>
    </select>
</div>

<div class="form-group">
    <label for="numDots" class="form-label">Dots per Bar:</label>
    <input type="number" id="numDots" name="numDots" class="form-input" value="15" min="5" max="40" />
</div>

<div class="form-group">
    <label for="cornerRadius" class="form-label">Corner Radius:</label>
    <input type="number" id="cornerRadius" name="cornerRadius" class="form-input" value="20" min="0" max="60" />
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('language').value = pluginSettings.language || 'en';
            document.getElementById('numDots').value = pluginSettings.numDots || '15';
            document.getElementById('cornerRadius').value = pluginSettings.cornerRadius || '20';
        }
    });
</script>
