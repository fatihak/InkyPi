<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        <option value="en">English</option>
        <option value="pt">Português</option>
    </select>
</div>

<div class="form-group">
    <label for="numBars" class="form-label">Loading Bar Rows:</label>
    <select id="numBars" name="numBars" class="form-input">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>
</div>

<div class="form-group">
    <label for="numDots" class="form-label">Dots per Bar:</label>
    <input type="number" id="numDots" name="numDots" class="form-input" min="5" max="40" />
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const languageEl = document.getElementById('language');
        const numBarsEl = document.getElementById('numBars');
        const numDotsEl = document.getElementById('numDots');

        // Helper function to safely get value from pluginSettings
        function getSafeValue(key, defaultValue) {
            if (typeof pluginSettings !== 'object' || pluginSettings === null) {
                return defaultValue;
            }
            const val = pluginSettings[key];
            return (val !== undefined && val !== null && val !== '') ? String(val) : defaultValue;
        }

        // Set initial values with defaults
        languageEl.value = getSafeValue('language', 'en');
        numBarsEl.value = getSafeValue('numBars', '2');
        numDotsEl.value = getSafeValue('numDots', '20');
    });
</script>
