<div class="form-group">
	<div class="form-group">
		<label for="primaryColor" class="form-label">Primary Color:</label>
		<input type="color" name="primaryColor" class="color-picker" value="#e61a1a" />
	</div>
	<div class="form-group">
		<label for="highlightColor" class="form-label">Highlight Color:</label>
		<input type="color" name="highlightColor" class="color-picker" value="#a30d0d" />
	</div>
</div>

<script>
	document.addEventListener('DOMContentLoaded', () => {
		if (loadPluginSettings) {
			if (pluginSettings.primaryColor) {
				document.querySelector('[name=primaryColor]').value = pluginSettings.primaryColor;
			}

			if (pluginSettings.highlightColor) {
				document.querySelector('[name=highlightColor]').value = pluginSettings.highlightColor;
			} else if (pluginSettings.secondaryColor) {
				document.querySelector('[name=highlightColor]').value = pluginSettings.secondaryColor;
			}
		}
	});
</script>
