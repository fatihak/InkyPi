<div class="mb-3" style="margin-bottom:24px;">
    <small class="text-muted">Displays the current time, date, and day progress. Uses the timezone and time format configured in Settings.</small>
</div>

<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        <option value="da">Danish</option>
        <option value="nl">Dutch</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="nb">Norwegian</option>
        <option value="pt">Portuguese</option>
        <option value="es">Spanish</option>
        <option value="sv">Swedish</option>
    </select>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="primaryColor" class="form-label">Primary Color:</label>
        <input type="color" name="primaryColor" class="color-picker" value="#000000"/>
    </div>
    <div class="form-group">
        <label for="secondaryColor" class="form-label">Secondary Color:</label>
        <input type="color" name="secondaryColor" class="color-picker" value="#ffffff"/>
    </div>
    <div class="form-group">
        <label for="progressBarColor" class="form-label">Progress Bar Color:</label>
        <input type="color" name="progressBarColor" class="color-picker" value="#cc3232"/>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const language = document.getElementById('language');
        if (typeof pluginSettings === 'object' && pluginSettings !== null && pluginSettings.language) {
            language.value = pluginSettings.language;
            if (!language.querySelector(`option[value="${pluginSettings.language}"]`)) {
                language.value = 'en';
            }
        } else {
            language.value = 'en';
        }

        if (pluginSettings.primaryColor) {
            document.querySelector("[name=primaryColor]").value = pluginSettings.primaryColor;
        }
        if (pluginSettings.secondaryColor) {
            document.querySelector("[name=secondaryColor]").value = pluginSettings.secondaryColor;
        }
        if (pluginSettings.progressBarColor) {
            document.querySelector("[name=progressBarColor]").value = pluginSettings.progressBarColor;
        }
    });
</script>
