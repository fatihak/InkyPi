<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/display.png') }}">
<script>
    // Translations for strings built in JavaScript (Settings > Interface language)
    window.I18N = {{ i18n_catalog | tojson }};
    function t(text, vars) {
        let out = (window.I18N && window.I18N[text]) || text;
        if (vars) Object.keys(vars).forEach(k => { out = out.split('{' + k + '}').join(vars[k]); });
        return out;
    }
</script>
<script>
    // Apply the theme before first paint (no flash of the wrong theme)
    (function () {
        var theme = null;
        try { theme = localStorage.getItem('inkypi-theme'); } catch (e) { /* storage unavailable */ }
        if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/main.css') }}">
{# Accent colour chosen in Settings (overrides the defaults of main.css) #}
<style id="accentStyle">
    :root {
        --accent-primary: {{ accent.primary }};
        --accent-hover: {{ accent.hover }};
        --accent-rgb: {{ accent.rgb }};
        --accent-text: {{ accent.text_light }};
        --success-color: {{ accent.primary }};
    }
    html[data-theme="dark"] {
        --accent-primary: {{ accent.primary }};
        --accent-hover: {{ accent.hover }};
        --accent-text: {{ accent.text_dark }};
        --success-color: {{ accent.primary }};
    }
</style>
<script src="{{ url_for('static', filename='scripts/dark_mode.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/response_modal.js') }}"></script>
