<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/display.png') }}">
<script>
    // Apply the theme before first paint (no flash of the wrong theme)
    (function () {
        var theme = null;
        try { theme = localStorage.getItem('inkypi-theme'); } catch (e) { /* storage unavailable */ }
        if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/main.css') }}">
<script src="{{ url_for('static', filename='scripts/dark_mode.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/response_modal.js') }}"></script>
