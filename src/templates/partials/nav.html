{# Top navigation shared by every page. Set `active_page` before including. #}
<nav class="topbar" aria-label="Main">
    <a class="topbar-brand" href="{{ url_for('main.main_page') }}" title="Home">
        <img src="{{ url_for('static', filename='icons/display.png') }}" alt="" class="topbar-logo">
        <span class="topbar-name">{{ device_name or 'InkyPi' }}</span>
    </a>
    <div class="topbar-links">
        <a href="{{ url_for('playlist.playlists') }}" class="topbar-link {% if active_page == 'playlists' %}active{% endif %}"
           {% if active_page == 'playlists' %}aria-current="page"{% endif %}>
            <img src="{{ url_for('static', filename='icons/playlist.png') }}" alt="" class="topbar-icon">
            <span>Playlists</span>
        </a>
        <a href="{{ url_for('settings.settings_page') }}" class="topbar-link {% if active_page == 'settings' %}active{% endif %}"
           {% if active_page == 'settings' %}aria-current="page"{% endif %}>
            <img src="{{ url_for('static', filename='icons/settings.png') }}" alt="" class="topbar-icon">
            <span>Settings</span>
        </a>
        <a href="{{ url_for('apikeys.apikeys_page') }}" class="topbar-link {% if active_page == 'apikeys' %}active{% endif %}"
           {% if active_page == 'apikeys' %}aria-current="page"{% endif %}>
            <span class="topbar-emoji" aria-hidden="true">🔑</span>
            <span>API Keys</span>
        </a>
        <button type="button" class="topbar-link dark-mode-toggle" title="Switch theme" aria-label="Switch theme"></button>
    </div>
</nav>
